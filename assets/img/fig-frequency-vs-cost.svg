<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="40" y="34" font-size="17" font-weight="600" fill="#1f2328">Prioritize by total cost, not by how often a bug is reported</text>
  <text x="40" y="56" font-size="13" fill="#59636e">Illustrative positions, not actual data. Bubble size = frequency × per-incident cost.</text>
  <line x1="90" y1="390" x2="720" y2="390" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="90" y1="390" x2="90" y2="80" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="405" y="420" font-size="13" fill="#59636e" text-anchor="middle">How often drivers report it →</text>
  <text x="30" y="235" font-size="13" fill="#59636e" text-anchor="middle" transform="rotate(-90 30 235)">Satisfaction cost per incident →</text>
  <line x1="405" y1="80" x2="405" y2="390" stroke="#d9dee3" stroke-dasharray="4 4"/>
  <line x1="90" y1="235" x2="720" y2="235" stroke="#d9dee3" stroke-dasharray="4 4"/>
  <text x="700" y="98" font-size="12" fill="#9aa4ae" text-anchor="end">frequent and costly</text>
  <text x="110" y="98" font-size="12" fill="#9aa4ae">rare but costly</text>
  <text x="700" y="380" font-size="12" fill="#9aa4ae" text-anchor="end">frequent, forgiven</text>
  <text x="110" y="380" font-size="12" fill="#9aa4ae">rare, forgiven</text>
  <circle cx="650" cy="250" r="34" fill="#0b5fa5" fill-opacity=".25" stroke="#0b5fa5"/>
  <text x="650" y="246" font-size="12.5" fill="#1f2328" text-anchor="middle">Misinterprets</text>
  <text x="650" y="262" font-size="12.5" fill="#1f2328" text-anchor="middle">the request</text>
  <circle cx="490" cy="135" r="38" fill="#c2410c" fill-opacity=".25" stroke="#c2410c"/>
  <text x="490" y="131" font-size="12.5" fill="#1f2328" text-anchor="middle">Confirms, then</text>
  <text x="490" y="147" font-size="12.5" fill="#1f2328" text-anchor="middle">does nothing</text>
  <circle cx="370" cy="165" r="30" fill="#c2410c" fill-opacity=".25" stroke="#c2410c"/>
  <text x="370" y="161" font-size="12.5" fill="#1f2328" text-anchor="middle">Does the</text>
  <text x="370" y="177" font-size="12.5" fill="#1f2328" text-anchor="middle">wrong thing</text>
  <circle cx="540" cy="335" r="20" fill="#59636e" fill-opacity=".2" stroke="#59636e"/>
  <text x="540" y="339" font-size="12" fill="#1f2328" text-anchor="middle">Too wordy</text>
  <circle cx="200" cy="330" r="16" fill="#59636e" fill-opacity=".2" stroke="#59636e"/>
  <text x="200" y="358" font-size="12" fill="#1f2328" text-anchor="middle">Interrupts itself</text>
  <circle cx="230" cy="190" r="20" fill="#59636e" fill-opacity=".2" stroke="#59636e"/>
  <text x="230" y="222" font-size="12" fill="#1f2328" text-anchor="middle">Refuses a question</text>
  <text x="40" y="446" font-size="12" fill="#c2410c" font-style="italic">Frequency alone would have put the blue bubble first.</text>
  <text x="40" y="462" font-size="12" fill="#c2410c" font-style="italic">Total cost (frequency × per-incident cost) moved the two orange action failures above it.</text>
</svg>
