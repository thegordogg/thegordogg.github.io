<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="40" y="34" font-size="17" font-weight="600" fill="#111111">Why weighting changes rankings even when it doesn't change the headline</text>
  <text x="40" y="56" font-size="13" fill="#5b6168">Toy example with made-up values. Each brand's score is a mix of its models; the sample over-recruited</text>
  <text x="40" y="74" font-size="13" fill="#5b6168">some models, so raw means reward whoever we happened to reach.</text>
  <text x="110" y="112" font-size="13" font-weight="600" fill="#111111">Raw sample means</text>
  <text x="110" y="130" font-size="12" fill="#5b6168">(each respondent counts once)</text>
  <rect x="110" y="150" width="220" height="22" fill="#1f4fa3"/><text x="102" y="166" font-size="12" fill="#111111" text-anchor="end">Brand A</text>
  <rect x="110" y="182" width="190" height="22" fill="#1f4fa3"/><text x="102" y="198" font-size="12" fill="#111111" text-anchor="end">Brand B</text>
  <rect x="110" y="214" width="160" height="22" fill="#1f4fa3"/><text x="102" y="230" font-size="12" fill="#111111" text-anchor="end">Brand C</text>
  <text x="110" y="262" font-size="12" fill="#5b6168">Ranking: A, B, C</text>
  <text x="392" y="200" font-size="26" fill="#111111" text-anchor="middle">→</text>
  <text x="392" y="150" font-size="11" fill="#5b6168" text-anchor="middle">weight to</text>
  <text x="392" y="164" font-size="11" fill="#5b6168" text-anchor="middle">fleet share</text>
  <text x="500" y="112" font-size="13" font-weight="600" fill="#111111">Weighted to fleet share</text>
  <text x="500" y="130" font-size="12" fill="#5b6168">(weighted by the drivers they represent)</text>
  <rect x="500" y="150" width="180" height="22" fill="#d7262a"/><text x="492" y="166" font-size="12" fill="#111111" text-anchor="end">Brand A</text>
  <rect x="500" y="182" width="215" height="22" fill="#d7262a"/><text x="492" y="198" font-size="12" fill="#111111" text-anchor="end">Brand B</text>
  <rect x="500" y="214" width="165" height="22" fill="#d7262a"/><text x="492" y="230" font-size="12" fill="#111111" text-anchor="end">Brand C</text>
  <text x="500" y="262" font-size="12" fill="#5b6168">Ranking: B, A, C</text>
  <text x="40" y="310" font-size="12.5" fill="#111111">In the real program the top drivers of satisfaction (performance and reliability) were the same either way.</text>
  <text x="40" y="328" font-size="12.5" fill="#111111">The order of brands and the order of drivers changed, and rankings are what partners act on.</text>
  <text x="40" y="358" font-size="12" fill="#8a9199">Illustrative; bar lengths are invented.</text>
</svg>
