<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">Gordon Heltzel, PhD</a>
  <nav class="site-nav">
    <a href="{{ '/work/' | relative_url }}">Work</a>
    <a href="{{ '/methods/' | relative_url }}">How I work</a>
    <a href="{{ '/publications/' | relative_url }}">Publications</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <a class="button" href="{{ '/assets/Gordon_Heltzel_Resume.pdf' | relative_url }}">Résumé</a>
  </nav>
</header>
<main class="content">
{{ content }}
</main>
<footer class="site-footer">
  <p><a href="mailto:{{ site.email }}">{{ site.email }}</a> · <a href="{{ site.linkedin }}">LinkedIn</a> · <a href="{{ site.scholar }}">Google Scholar</a></p>
  <p class="fine">Industry case studies describe decisions, methods, and sample sizes only. Figures on those pages are illustrative and labeled as such.</p>
</footer>
</body>
</html>
